version: "3.8"

services:
  oracle:
    image: public.ecr.aws/v5p9f2o9/zkusd-oracle:latest
    container_name: zkusd-oracle
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - redis
    environment:
      - DEPLOYER_KEY=${DEPLOYER_KEY}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CHAIN=${CHAIN}
      - PRICE_POLLING_INTERVAL=${PRICE_POLLING_INTERVAL}
      - CERTIFICATE_POLLING_INTERVAL=${CERTIFICATE_POLLING_INTERVAL}
      - BINANCE=${BINANCE}
      - CRYPTOCOMPARE=${CRYPTOCOMPARE}
      - COINPAPRIKA=${COINPAPRIKA}
      - MESSARI=${MESSARI}
      - COINCAP=${COINCAP}
      - COINLORE=${COINLORE}
      - COINCODEX=${COINCODEX}
      - COINGECKO=${COINGECKO}
      - KUCOIN=${KUCOIN}
      - HUOBI=${HUOBI}
      - BYBIT=${BYBIT}
      - CEXIO=${CEXIO}
      - SWAPZONE=${SWAPZONE}
      - MEXC=${MEXC}
      - GATEIO=${GATEIO}
      - OKX=${OKX}
    volumes:
      - oracle-data:/app/src/errors

  redis:
    image: redis:alpine
    container_name: zkusd-oracle-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  oracle-data:
