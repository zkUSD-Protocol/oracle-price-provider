name: Build and Push Oracle Price Provider

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write # requesting the OIDC JWT token

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      # Outputs for the second job:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
      docker_tag: ${{ steps.set_docker_tag.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::565802942559:role/zkusd-services-github-actions-role
          aws-region: eu-central-1

      - name: Set Docker tag
        id: set_docker_tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT

      # 7) LOGIN TO ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: true

      # 8) BUILD AND PUSH DOCKER IMAGE
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/zkusd-oracle:latest
            ${{ steps.login-ecr.outputs.registry }}/zkusd-oracle:${{ steps.set_docker_tag.outputs.tag }}

  push-to-public-ecr:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials (OIDC) for public ECR
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::565802942559:role/zkusd-services-github-actions-role
          aws-region: us-east-1 # Public ECR is in us-east-1

      - name: Login to Amazon ECR Public
        id: login-ecr-public
        uses: aws-actions/amazon-ecr-login@v1
        with:
          registry-type: public
          mask-password: true

      - name: Pull and retag image
        run: |
          docker pull ${{ needs.build-and-push.outputs.ecr_registry }}/zkusd-oracle:${{ needs.build-and-push.outputs.docker_tag }}
          docker tag ${{ needs.build-and-push.outputs.ecr_registry }}/zkusd-oracle:${{ needs.build-and-push.outputs.docker_tag }} public.ecr.aws/v5p9f2o9/zkusd-oracle:${{ needs.build-and-push.outputs.docker_tag }}
          docker tag ${{ needs.build-and-push.outputs.ecr_registry }}/zkusd-oracle:${{ needs.build-and-push.outputs.docker_tag }} public.ecr.aws/v5p9f2o9/zkusd-oracle:latest
          docker push public.ecr.aws/v5p9f2o9/zkusd-oracle:${{ needs.build-and-push.outputs.docker_tag }}
          docker push public.ecr.aws/v5p9f2o9/zkusd-oracle:latest
